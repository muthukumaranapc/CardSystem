name: CardSystem CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Clean, Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Clean solution
        run: dotnet clean CardSystem.slnx --configuration Release

      - name: Restore dependencies
        run: dotnet restore CardSystem.slnx

      - name: Build solution
        run: dotnet build CardSystem.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test API.Test/API.Test.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Publish Card API
        run: dotnet publish API.Card/API.Card.csproj --configuration Release --no-build --no-restore --output ./publish/CardAPI

      - name: Publish Finance API
        run: dotnet publish API.Finance/API.Finance.csproj --configuration Release --no-build --no-restore --output ./publish/FinanceAPI

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CardSystem-Release
          path: publish/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardSystem-TestResults
          path: '**/test-results.trx'
          if-no-files-found: ignore
          retention-days: 14
