
name: CardSystem CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ---------------------------------------------
  # JOB 1: BUILD AND TEST
  # ---------------------------------------------
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CardSystem.slnx

      - name: Build solution
        run: dotnet build CardSystem.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test API.Test/API.Test.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardSystem-TestResults
          path: '**/test-results.trx'
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------
  # JOB 2: DOCKER BUILD AND DEPLOY
  # ---------------------------------------------
  deploy:
    name: Build and Deploy Windows Containers
    needs: build

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows, X64, cardsystem-production]

    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Check Docker engine
      - name: Verify Windows Docker Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          docker info
          if ($LASTEXITCODE -ne 0) {
              throw "Docker engine is not available."
          }

          $dockerOs = docker info --format '{{.OSType}}'

          if ($dockerOs.Trim() -ne 'windows') {
              throw "Docker must be configured for Windows containers."
          }

          docker compose version
          if ($LASTEXITCODE -ne 0) {
              throw "Docker Compose is not available."
          }

      # Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $env:GH_TOKEN | docker login ghcr.io `
              --username $env:GITHUB_ACTOR `
              --password-stdin

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub Container Registry login failed."
          }

      # Build and push Card API
      - name: Build and Push Card API Image
        shell: pwsh
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = 'Stop'

          $owner = $env:IMAGE_OWNER.ToLowerInvariant()
          $tag = $env:GITHUB_SHA

          $image = "ghcr.io/$owner/cardsystem-card-api:$tag"
          $latest = "ghcr.io/$owner/cardsystem-card-api:latest"

          docker build --pull `
              --file API.Card/Dockerfile `
              --tag $image .

          if ($LASTEXITCODE -ne 0) {
              throw "Card API Docker build failed."
          }

          docker push $image

          if ($LASTEXITCODE -ne 0) {
              throw "Card API Docker push failed."
          }

          docker tag $image $latest
          docker push $latest

          if ($LASTEXITCODE -ne 0) {
              throw "Card API latest image push failed."
          }

      # Build and push Finance API
      - name: Build and Push Finance API Image
        shell: pwsh
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = 'Stop'

          $owner = $env:IMAGE_OWNER.ToLowerInvariant()
          $tag = $env:GITHUB_SHA

          $image = "ghcr.io/$owner/cardsystem-finance-api:$tag"
          $latest = "ghcr.io/$owner/cardsystem-finance-api:latest"

          docker build --pull `
              --file API.Finance/Dockerfile `
              --tag $image .

          if ($LASTEXITCODE -ne 0) {
              throw "Finance API Docker build failed."
          }

          docker push $image

          if ($LASTEXITCODE -ne 0) {
              throw "Finance API Docker push failed."
          }

          docker tag $image $latest
          docker push $latest

          if ($LASTEXITCODE -ne 0) {
              throw "Finance API latest image push failed."
          }

      # Deploy using Docker Compose
      - name: Deploy APIs using Docker Compose
        shell: pwsh
        env:
          IMAGE_TAG: ${{ github.sha }}
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:SQL_CONNECTION_STRING)) {
              throw "SQL_CONNECTION_STRING secret is missing."
          }

          if (-not (Test-Path "docker-compose.yml")) {
              throw "docker-compose.yml was not found."
          }

          docker compose pull

          if ($LASTEXITCODE -ne 0) {
              throw "Docker image pull failed."
          }

          docker compose up -d --remove-orphans

          if ($LASTEXITCODE -ne 0) {
              throw "Docker deployment failed."
          }

          docker ps
